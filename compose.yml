name: sameplate

services:
  backend:
    build:
      context: ./backend

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./backend:/app
      - ./sample_data:/sample_data:ro

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

    depends_on:
      db:
        condition: service_healthy

    command: >
      uvicorn sameplate.main:create_app
      --host 0.0.0.0
      --factory
      --port 8000
      --reload
      --reload-dir /app/src
    
  db:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  db-test:
    image: postgres:18
    profiles: ["test"]
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: sameplate_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d sameplate_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    
  tests:
    build:
      context: ./backend
    profiles: ["test"]
    volumes:
      - ./backend:/app
    environment:
      POSTGRES_HOST: db-test
      POSTGRES_PORT: "5432"
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: sameplate_test
    depends_on:
      db-test:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && pytest -q"]


volumes:
  postgres_data:
