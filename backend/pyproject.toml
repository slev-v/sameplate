[project]
name = "sameplate"
version = "0.1.0"
description = "A real-time collaborative meal selection app that helps couples and friends effortlessly agree on what to cook based on shared tastes and available ingredients."
readme = "README.md"
authors = [
    { email = "stasrudometkin2@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.ruff.lint.isort]
known-first-party = ["sameplate"]
known-third-party = ["alembic"]